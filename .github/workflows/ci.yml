name: CLI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/runivo
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --version "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*/*.*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/"$RELEASE_TAG"/*.zip dist/"$RELEASE_TAG"/*.tar.gz dist/"$RELEASE_TAG"/checksums.txt --verify-tag --title "Runivo CLI $RELEASE_TAG" --notes-file CHANGELOG.md
